version: 2.1

jobs:
  trolley-model-alpha:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build @ T0
          command: |
            mkdir -p /tmp/ingest
            set +o pipefail 2>/dev/null; seq 1 791751 | tr a-z A-Z > /tmp/ingest/79d82c03; true
            echo "stage finished"
      - persist_to_workspace:
          root: /tmp/ingest
          paths:
            - '79d82c03'
  PreparePipeline:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ingest
      - run:
          name: Fetch baseline
          command: |
            # combined
            echo "$(wc -c < /tmp/ingest/stagedf1540 2>/dev/null) $(md5sum /tmp/ingest/stagedf1540 2>/dev/null | cut -c1-6)"
      - run:
          name: Checkout main
          command: git clone --depth 3 -q --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore inputs
          command: tar --extract -f sources-release.tar
      - run:
          command: sleep 60
      - run:
          command: sleep 30
      - run:
          command: sleep 15
      - run:
          command: $PWD/fuel-bootstrapper
